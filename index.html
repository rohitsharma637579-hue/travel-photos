<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frames at Altitude: travel photography by Rohit Sharma</title>
<meta name="description" content="Travel photography by Rohit Sharma from Kedarnath, Tungnath, Munsiyari, Rishikesh, Jaipur and more, sorted by destination and altitude.">
<meta name="theme-color" content="#12262B">
<meta property="og:type" content="website">
<meta property="og:title" content="Frames at Altitude: travel photography by Rohit Sharma">
<meta property="og:description" content="Destinations, altitudes and photographs from the road.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{
  --mist:#E8EDEB;
  --snow:#F6F8F7;
  --ink:#12262B;
  --deep:#0C1B1F;
  --slate:#586C70;
  --glacier:#2C7A87;
  --marigold:#E59A2F;
  --line:#C5D0CE;
  --display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --pad:clamp(1.25rem,4vw,3.5rem);
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--mist);color:var(--ink);font-family:var(--serif);font-size:1.125rem;line-height:1.65;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--marigold);outline-offset:3px}
section{scroll-margin-top:4.5rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.empty{color:var(--slate);font-style:italic}

/* ---------- header (transparent over photos, solid after scrolling) ---------- */
.site-header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem var(--pad);background:color-mix(in srgb,var(--mist) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);font-family:var(--display);transition:background .35s,color .35s,border-color .35s}
body{padding-top:3.6rem}
body.has-hero{padding-top:0}
.brand{font-weight:800;font-size:1.05rem;text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
@media (max-width:520px){.site-header nav{gap:1rem;font-size:.9rem}.brand{font-size:.95rem}}
.site-header nav{display:flex;gap:1.6rem;font-size:.95rem}
.site-header nav a{text-decoration:none;padding:.25rem 0;border-bottom:2px solid transparent;opacity:.85}
.site-header nav a:hover{opacity:1;border-color:var(--marigold)}
.has-hero:not(.scrolled) .site-header{background:transparent;backdrop-filter:none;border-color:transparent;color:#fff}

/* ---------- shared ---------- */
.wrap{padding:0 var(--pad)}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
h2{font-size:clamp(1.9rem,3.8vw,3rem)}
.eyebrow{font-family:var(--display);font-weight:600;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--glacier);margin-bottom:.7rem}
.lede{color:var(--slate);max-width:52ch}
.btn{display:inline-block;font-family:var(--display);font-weight:600;font-size:1rem;text-decoration:none;background:var(--ink);color:var(--snow);padding:.85rem 1.5rem;border-radius:999px;border:0;transition:background .2s,transform .2s}
.btn:hover{background:var(--glacier)}
.btn.gold{background:var(--marigold);color:var(--deep)}
.btn.gold:hover{background:#F2AE4C}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.frame{position:relative;overflow:hidden;background:linear-gradient(160deg,hsl(var(--h) 32% 64%),hsl(calc(var(--h) + 35) 30% 32%))}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s ease,transform .8s ease}
img.in{opacity:1}
.reveal{opacity:0;translate:0 26px;transition:opacity .8s cubic-bezier(.2,.7,.2,1),translate .8s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0) * 70ms)}
.reveal.in-view{opacity:1;translate:none}
.block{padding:clamp(3rem,7vw,6rem) var(--pad)}

/* ---------- hero with photo slideshow ---------- */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;color:#fff;background:var(--deep);isolation:isolate}
.slides,.slide{position:absolute;inset:0}
.slide{opacity:0;transition:opacity 1.4s ease;background:linear-gradient(160deg,hsl(var(--h) 32% 40%),hsl(calc(var(--h) + 35) 30% 16%));overflow:hidden}
.slide.active{opacity:1}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}
.slide img.in{opacity:1}
.slide.active img{animation:kenburns 10s ease-out forwards}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.09)}}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:
  linear-gradient(to top,rgba(8,18,20,.86) 0%,rgba(8,18,20,.45) 40%,rgba(8,18,20,.30) 70%,rgba(8,18,20,.55) 100%)}
.hero-main{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:7rem var(--pad) 2rem;max-width:64rem}
.hero .eyebrow{color:var(--marigold)}
.hero h1{font-size:clamp(2.7rem,7vw,6rem);font-variation-settings:"opsz" 96;text-shadow:0 2px 24px rgba(0,0,0,.35);margin-bottom:1.1rem}
.hero .lede{color:#DCE6E4;font-size:1.2rem;margin-bottom:1.75rem}
.search{display:flex;gap:.5rem;max-width:34rem;padding:.4rem;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(10px)}
.search input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:inherit;font-family:var(--display);font-size:1rem;padding:.6rem 1.1rem}
.search input::placeholder{color:rgba(255,255,255,.75)}
.search input:focus{outline:none}
.search:focus-within{border-color:#fff;box-shadow:0 0 0 3px rgba(229,154,47,.6)}
.hero-bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem var(--pad) 1.75rem;font-family:var(--display);font-size:.95rem;border-top:1px solid rgba(255,255,255,.22);margin:0 var(--pad);padding-left:0;padding-right:0}
.hero-cap a{text-decoration:none;border-bottom:2px solid var(--marigold)}
.dots{display:flex;gap:.55rem}
.dot{width:.7rem;height:.7rem;padding:0;border-radius:50%;border:1.5px solid #fff;background:transparent;transition:background .3s,transform .3s}
.dot[aria-current="true"]{background:#fff;transform:scale(1.25)}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 140ms + 200ms)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--ink);color:var(--snow)}
.stat{padding:clamp(1.5rem,3vw,2.5rem) var(--pad);border-right:1px solid rgba(255,255,255,.12)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(2rem,4.5vw,3.4rem);line-height:1;letter-spacing:-.02em;color:var(--marigold)}
.stat span{font-family:var(--display);font-size:.92rem;color:#B9C8C6}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid rgba(255,255,255,.12)}}

/* ---------- featured ---------- */
.featured{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(1.5rem,4vw,4rem);align-items:center}
.featured .frame{aspect-ratio:4/3;border-radius:var(--radius)}
.featured h2{margin-bottom:1rem}
.featured p{color:var(--slate);margin-bottom:1.5rem;max-width:46ch}
.tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.75rem}
.tag{font-family:var(--display);font-size:.88rem;font-weight:600;padding:.35rem .85rem;border-radius:999px;background:var(--snow);border:1px solid var(--line)}
@media (max-width:820px){.featured{grid-template-columns:1fr}}

/* ---------- destinations grid ---------- */
.places{background:var(--snow);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.places-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:1rem 2rem;margin-bottom:1.5rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:2rem}
.chip{font-family:var(--display);font-weight:600;font-size:.92rem;padding:.5rem 1.1rem;border-radius:999px;background:transparent;border:1.5px solid var(--line);transition:background .2s,color .2s,border-color .2s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--snow);border-color:var(--ink)}
.count{font-family:var(--display);font-size:.95rem;color:var(--slate)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,17.5rem),1fr));gap:1.5rem}
.card{position:relative;display:block;aspect-ratio:3/4;border-radius:var(--radius);overflow:hidden;text-decoration:none;color:#fff;box-shadow:0 1px 2px rgba(18,38,43,.08);transition:opacity .8s cubic-bezier(.2,.7,.2,1) calc(var(--i,0) * 70ms),translate .8s cubic-bezier(.2,.7,.2,1) calc(var(--i,0) * 70ms),box-shadow .3s,transform .3s}
.card:hover,.card:focus-visible{box-shadow:0 18px 40px -12px rgba(18,38,43,.45);transform:translateY(-4px)}
.card .frame{position:absolute;inset:0}
.card:hover .frame img,.card:focus-visible .frame img{transform:scale(1.07)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,18,20,.85) 0%,rgba(8,18,20,.15) 55%,rgba(8,18,20,.25) 100%)}
.badge{position:absolute;top:1rem;z-index:2;font-family:var(--display);font-size:.8rem;font-weight:600;padding:.3rem .75rem;border-radius:999px;background:rgba(255,255,255,.9);color:var(--ink)}
.badge.l{left:1rem}
.badge.r{right:1rem;background:var(--marigold)}
.card-body{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:1.25rem}
.card h3{font-size:clamp(1.35rem,2vw,1.7rem);margin-bottom:.15rem;overflow-wrap:anywhere}
.card-meta{display:flex;justify-content:space-between;font-family:var(--display);font-size:.9rem;color:#DCE6E4}
.card .go{opacity:0;transform:translateX(-6px);transition:opacity .3s,transform .3s}
.card:hover .go,.card:focus-visible .go{opacity:1;transform:none}
.no-match{padding:2rem 0}

/* ---------- altitude ribbon ---------- */
.ribbon-scroll{overflow-x:auto;margin-top:1.5rem;padding-bottom:.5rem}
.ribbon{min-width:720px;width:100%;height:auto;display:block}
.ribbon .base{stroke:var(--line);stroke-width:1.5}
.ribbon .area{fill:var(--glacier);opacity:.10}
.ribbon .line{fill:none;stroke:var(--glacier);stroke-width:3;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.ribbon.go .line{animation:draw 2.2s cubic-bezier(.5,0,.2,1) forwards}
.ribbon.go .area{animation:fadein 1.2s 1.4s ease both}
.ribbon .pt circle{fill:var(--marigold);stroke:var(--ink);stroke-width:2;transition:r .2s}
.ribbon a:hover circle,.ribbon a:focus-visible circle{r:11}
.ribbon .pt text{font-family:var(--display);fill:var(--ink)}
.ribbon .pt .nm{font-size:18px;font-weight:600}
.ribbon .pt .el{font-size:15px;fill:var(--slate)}
.ribbon .axis{font-family:var(--display);font-size:13px;fill:var(--slate)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}}

/* ---------- map ---------- */
.map-sec{background:var(--snow);border-top:1px solid var(--line)}
#map-canvas{height:min(32rem,70vh);margin-top:1.5rem;border-radius:var(--radius);border:1px solid var(--line);background:var(--mist);z-index:0}
.leaflet-popup-content a{font-family:var(--display);color:var(--glacier)}

/* ---------- about / contact ---------- */
.cta{background:var(--ink);color:var(--snow);display:grid;grid-template-columns:1.2fr 1fr;gap:2.5rem;align-items:center}
.cta .eyebrow{color:var(--marigold)}
.cta h2{margin-bottom:1rem}
.cta p{color:#B9C8C6;max-width:46ch}
.cta-links{display:flex;flex-wrap:wrap;gap:.75rem}
@media (max-width:820px){.cta{grid-template-columns:1fr}}

/* ---------- destination page ---------- */
.p-hero{position:relative;min-height:78vh;min-height:78svh;display:flex;align-items:flex-end;color:#fff;background:var(--deep);isolation:isolate;overflow:hidden}
.p-hero .frame{position:absolute;inset:0;z-index:-2}
.p-hero .frame img{animation:kenburns 12s ease-out forwards}
.p-hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(8,18,20,.85) 0%,rgba(8,18,20,.25) 55%,rgba(8,18,20,.5) 100%)}
.p-hero-in{padding:7rem var(--pad) clamp(2rem,5vw,3.5rem);width:100%}
.p-hero .back{display:inline-block;font-family:var(--display);font-size:.95rem;text-decoration:none;border-bottom:2px solid var(--marigold);margin-bottom:1.5rem}
.p-hero h1{font-size:clamp(3rem,10vw,8rem);font-variation-settings:"opsz" 96;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.p-hero .tags{margin:1.25rem 0 0}
.p-hero .tag{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff;backdrop-filter:blur(6px)}
.factbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));background:var(--ink);color:var(--snow)}
.fact{padding:1.4rem var(--pad);border-right:1px solid rgba(255,255,255,.12)}
.fact:last-child{border-right:0}
.fact b{display:block;font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.1;color:var(--marigold)}
.fact span{font-family:var(--display);font-size:.88rem;color:#B9C8C6}
.story{display:grid;grid-template-columns:12rem 1fr;gap:2rem}
.story p{font-size:1.3rem;max-width:60ch}
@media (max-width:700px){.story{grid-template-columns:1fr;gap:.5rem}}
.gallery-head{display:flex;justify-content:space-between;align-items:end;gap:1rem;margin-bottom:1.5rem}
.gallery{column-count:3;column-gap:1rem}
.g-item{display:block;width:100%;margin:0 0 1rem;padding:0;border:0;border-radius:10px;break-inside:avoid;cursor:zoom-in;overflow:hidden;background:linear-gradient(160deg,hsl(var(--h) 32% 64%),hsl(calc(var(--h) + 35) 30% 32%));min-height:9rem}
.g-item img{width:100%;height:auto;opacity:0;transition:opacity .6s ease,transform .6s ease}
.g-item img.in{opacity:1}
.g-item:hover img{transform:scale(1.04)}
@media (max-width:900px){.gallery{column-count:2}}
@media (max-width:520px){.gallery{column-count:1}}
.more{background:var(--snow);border-top:1px solid var(--line)}
.more h2{margin-bottom:1.5rem}

/* ---------- lightbox ---------- */
dialog#lb{border:0;padding:0;background:transparent;width:100vw;height:100vh;max-width:none;max-height:none;color:#fff}
dialog#lb[open]{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.5rem;padding:1rem}
dialog#lb::backdrop{background:rgba(9,18,20,.94)}
#lb figure{display:flex;flex-direction:column;align-items:center;gap:.75rem;min-width:0}
#lb-img{max-width:100%;max-height:80vh;object-fit:contain;touch-action:pan-y;user-select:none}
#lb-cap{font-family:var(--display);font-size:.95rem;text-align:center;color:#C9D6D4;display:flex;flex-direction:column;gap:.1rem}
.lb-btn{font-family:var(--display);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;transition:background .2s}
.lb-btn:hover{background:rgba(255,255,255,.2)}
.lb-nav{width:3rem;height:3rem;font-size:1.6rem;line-height:1}
.lb-close{position:absolute;top:1rem;right:1rem;padding:.5rem 1.1rem;font-size:.95rem}
@media (max-width:640px){
  dialog#lb[open]{grid-template-columns:1fr;grid-template-rows:1fr auto;align-content:center}
  .lb-nav{display:none}
}

/* ---------- footer ---------- */
footer{padding:1.5rem var(--pad);background:var(--deep);color:#93A6A4;font-family:var(--display);font-size:.9rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1;translate:none}
  .ribbon .line{stroke-dashoffset:0}
}
</style>
<style>
/* ===== Colour themes for the pale areas (extra layer; nothing else changed) ===== */
body{
  --sun:#FFB86B; --mint:#7FD1C7; --rose:#F58FA3; --sky:#9DB7FF; --lilac:#C9A7F5;
  --rainbow:linear-gradient(90deg,var(--sun),var(--rose),var(--lilac),var(--sky),var(--mint));
}
body .block{position:relative}

/* home page sections */
body .featured{background-image:
  radial-gradient(38rem 26rem at 96% 6%,rgba(255,184,107,0.60),transparent 70%),
  radial-gradient(34rem 26rem at 2% 100%,rgba(127,209,199,0.56),transparent 70%),
  radial-gradient(22rem 16rem at 55% 0%,rgba(245,143,163,0.31),transparent 70%)}
body .places{background-image:
  radial-gradient(40rem 28rem at 0% 0%,rgba(157,183,255,0.50),transparent 70%),
  radial-gradient(36rem 28rem at 100% 100%,rgba(255,184,107,0.50),transparent 70%),
  radial-gradient(26rem 20rem at 100% 0%,rgba(245,143,163,0.34),transparent 70%)}
body #altitude{background-image:
  radial-gradient(40rem 26rem at 100% 0%,rgba(201,167,245,0.53),transparent 70%),
  radial-gradient(38rem 26rem at 0% 100%,rgba(157,183,255,0.50),transparent 70%),
  radial-gradient(26rem 20rem at 60% 100%,rgba(127,209,199,0.37),transparent 70%)}
body .map-sec{background-image:
  radial-gradient(40rem 26rem at 0% 0%,rgba(127,209,199,0.53),transparent 70%),
  radial-gradient(38rem 26rem at 100% 100%,rgba(201,167,245,0.46),transparent 70%),
  radial-gradient(24rem 18rem at 100% 0%,rgba(255,184,107,0.34),transparent 70%)}

/* destination page sections */
body .story{background-image:
  radial-gradient(36rem 22rem at 100% 0%,rgba(255,184,107,0.56),transparent 70%),
  radial-gradient(30rem 22rem at 0% 100%,rgba(245,143,163,0.40),transparent 70%)}
body [aria-labelledby="g-h"]{background-image:
  radial-gradient(40rem 28rem at 0% 0%,rgba(157,183,255,0.43),transparent 70%),
  radial-gradient(38rem 28rem at 100% 55%,rgba(127,209,199,0.43),transparent 70%),
  radial-gradient(30rem 22rem at 20% 100%,rgba(255,184,107,0.40),transparent 70%)}
body .more{background-image:
  radial-gradient(40rem 26rem at 100% 0%,rgba(245,143,163,0.43),transparent 70%),
  radial-gradient(36rem 26rem at 0% 100%,rgba(255,184,107,0.46),transparent 70%),
  radial-gradient(26rem 20rem at 50% 50%,rgba(157,183,255,0.25),transparent 70%)}

/* thin colour strip at the top of the light sections */
body .places::before,body #altitude::before,body .map-sec::before,body .more::before,body .story::before{
  content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--rainbow);pointer-events:none}

/* the dark call-to-action band stays exactly as it was */
body .cta{background-image:none}

/* small colourful touches */
body .featured .tag:nth-child(1){background:#FFE6C9;border-color:#FFCF98}
body .featured .tag:nth-child(2){background:#D5F3EE;border-color:#A6E1D8}
body .featured .tag:nth-child(3){background:#FDDDE4;border-color:#F8BBC9}
body .chip:not([aria-pressed="true"]){background:rgba(255,255,255,.72)}
body .chip:not([aria-pressed="true"]):hover{background:#FFF0DC;border-color:var(--sun)}
</style></head>
<body>

<header class="site-header">
  <a class="brand" href="#/">Frames at Altitude</a>
  <nav aria-label="Main">
    <a href="#/places">Destinations</a>
    <a href="#/map">Map</a>
    <a href="#/about">About</a>
  </nav>
</header>

<main id="app" tabindex="-1"><p class="wrap empty" style="padding-top:3rem">Loading photographs…</p></main>
<noscript><p class="wrap">This site needs JavaScript to show the photographs.</p></noscript>

<footer>
  <span>© <span id="yr"></span> Rohit Sharma</span>
  <span>Map data © OpenStreetMap contributors</span>
</footer>

<dialog id="lb" aria-label="Photograph viewer">
  <button class="lb-btn lb-close" type="button" data-act="close">Close</button>
  <button class="lb-btn lb-nav" type="button" data-act="prev" aria-label="Previous photograph">&#8249;</button>
  <figure>
    <img id="lb-img" alt="">
    <figcaption id="lb-cap"></figcaption>
  </figure>
  <button class="lb-btn lb-nav" type="button" data-act="next" aria-label="Next photograph">&#8250;</button>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(() => {
  const SITE = "Frames at Altitude";
  const ME = {
    name: "Rohit Sharma",
    github: "https://github.com/rohitsharma637579-hue",
    linkedin: "https://www.linkedin.com/in/rohit-sharma02-cse",
    email: "rohitsharma637579@gmail.com"
  };
  const WORDS = ["No","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten"];
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const app = document.getElementById("app");
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  let DATA = [], map = null, view = null, gallery = [];
  let heroItems = [], slideNo = 0, timer = null, io = null, filter = "all", query = "";

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const hue = id => [...id].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
  const num = n => n.toLocaleString("en-IN");
  const metres = n => num(n) + " m";
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const isNum = Number.isFinite;

  /* ---------- images: fade in when loaded, hide if the file is missing ---------- */
  document.addEventListener("load", e => { if (e.target.tagName === "IMG") e.target.classList.add("in"); }, true);
  document.addEventListener("error", e => {
    if (e.target.tagName !== "IMG" || e.target.id === "lb-img") return;
    (e.target.closest(".g-item") || e.target).remove();
  }, true);

  const frame = (d, src, alt = "", eager = false) =>
    `<div class="frame" style="--h:${hue(d.id)}">${src ? `<img src="${esc(src)}" alt="${esc(alt)}" ${eager ? "" : 'loading="lazy"'} decoding="async">` : ""}</div>`;

  /* ---------- scroll reveal + counters ---------- */
  function observe() {
    if (io) io.disconnect();
    const items = $$(".reveal:not(.in-view), [data-count]:not(.in-view), .ribbon:not(.go)");
    if (!("IntersectionObserver" in window) || reduced) {
      items.forEach(el => el.classList.add("in-view", "go"));
      items.filter(el => el.dataset.count).forEach(el => { el.textContent = num(+el.dataset.count); });
      return;
    }
    items.filter(el => el.dataset.count).forEach(el => { el.textContent = "0"; });
    io = new IntersectionObserver(entries => entries.forEach(en => {
      if (!en.isIntersecting) return;
      const el = en.target;
      io.unobserve(el);
      el.classList.add("in-view", "go");
      if (el.dataset.count) countUp(el);
    }), { threshold: 0.2 });
    items.forEach(el => io.observe(el));
  }
  function countUp(el) {
    const to = +el.dataset.count, t0 = performance.now(), dur = 1400;
    const step = t => {
      const p = Math.min(1, (t - t0) / dur);
      el.textContent = num(Math.round(to * (1 - Math.pow(1 - p, 3))));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /* ---------- cards + filters ---------- */
  const matches = d => {
    const q = query.trim().toLowerCase();
    const textOk = !q || `${d.name} ${d.region}`.toLowerCase().includes(q);
    const filterOk = filter === "all" ? true
      : filter === "high" ? isNum(d.elevation) && d.elevation >= 3000
      : d.region === filter;
    return textOk && filterOk;
  };
  const card = (d, i = 0) => `
    <a class="card reveal" style="--i:${i % 6}" href="#/${esc(d.id)}">
      ${frame(d, d.cover, `${d.name}, cover photograph`)}
      ${d.region ? `<span class="badge l">${esc(d.region)}</span>` : ""}
      ${isNum(d.elevation) ? `<span class="badge r">${metres(d.elevation)}</span>` : ""}
      <div class="card-body">
        <h3>${esc(d.name)}</h3>
        <div class="card-meta"><span>${plural(d.photos.length, "photograph")}</span><span class="go">Explore</span></div>
      </div>
    </a>`;

  function updateGrid() {
    const list = DATA.filter(matches);
    $("#grid").innerHTML = list.length
      ? list.map((d, i) => card(d, i)).join("")
      : `<p class="no-match empty">No destinations match your search yet.</p>`;
    $("#count").textContent = `${plural(list.length, "destination")}`;
    observe();
  }

  /* ---------- altitude ribbon ---------- */
  function ribbon() {
    const pts = DATA.filter(d => isNum(d.elevation)).sort((a, b) => a.elevation - b.elevation);
    if (pts.length < 2) return "";
    const W = 1000, H = 340, padX = 80, top = 56, bottom = 74;
    const max = Math.max(...pts.map(p => p.elevation)) * 1.08;
    const x = i => padX + i * (W - 2 * padX) / (pts.length - 1);
    const y = e => top + (1 - e / max) * (H - top - bottom);
    const base = H - bottom;
    const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p.elevation).toFixed(1)}`).join(" ");
    const area = `${line} L${x(pts.length - 1)} ${base} L${x(0)} ${base} Z`;
    const marks = pts.map((p, i) => `
      <a class="pt" href="#/${esc(p.id)}" aria-label="${esc(p.name)}, ${p.elevation} metres">
        <circle cx="${x(i).toFixed(1)}" cy="${y(p.elevation).toFixed(1)}" r="8"/>
        <text class="nm" x="${x(i).toFixed(1)}" y="${(y(p.elevation) - 18).toFixed(1)}" text-anchor="middle">${esc(p.name)}</text>
        <text class="el" x="${x(i).toFixed(1)}" y="${base + 30}" text-anchor="middle">${metres(p.elevation)}</text>
      </a>`).join("");
    return `<svg class="ribbon" viewBox="0 0 ${W} ${H}" role="group" aria-label="Places arranged by altitude">
      <path class="area" d="${area}"/>
      <line class="base" x1="${padX - 30}" y1="${base}" x2="${W - padX + 30}" y2="${base}"/>
      <text class="axis" x="${padX - 30}" y="${base + 54}">Sea level</text>
      <path class="line" pathLength="1" d="${line}"/>
      ${marks}
    </svg>`;
  }

  /* ---------- hero slideshow ---------- */
  function goSlide(n) {
    const slides = $$(".slide");
    if (!slides.length) return;
    slideNo = (n + slides.length) % slides.length;
    slides.forEach((s, j) => s.classList.toggle("active", j === slideNo));
    $$(".dot").forEach((b, j) => b.setAttribute("aria-current", j === slideNo ? "true" : "false"));
    const d = heroItems[slideNo];
    const cap = $("#hero-cap");
    if (cap && d) cap.innerHTML = `Now showing: <a href="#/${esc(d.id)}">${esc(d.name)}</a>${isNum(d.elevation) ? ", " + metres(d.elevation) : ""}`;
  }
  function startSlides() {
    clearInterval(timer);
    if (heroItems.length < 2 || reduced) return;
    timer = setInterval(() => goSlide(slideNo + 1), 6500);
  }

  /* ---------- home ---------- */
  function homeView() {
    const n = DATA.length;
    const elev = DATA.map(d => d.elevation).filter(isNum);
    const headline = n > 1 && elev.length > 1
      ? `${WORDS[n] || n} places, from ${metres(Math.min(...elev))} to ${metres(Math.max(...elev))}.`
      : "Photographs from the road.";
    const withCover = DATA.filter(d => d.cover);
    heroItems = (withCover.length ? withCover : DATA.slice(0, 1)).slice(0, 6);
    slideNo = 0;
    const totalPhotos = DATA.reduce((s, d) => s + d.photos.length, 0);
    const regions = new Set(DATA.map(d => d.region).filter(Boolean));
    const feat = DATA.find(d => d.featured) || withCover[0] || DATA[0];
    const featLine = feat.story || (isNum(feat.elevation) && feat.region ? `${feat.name} sits at ${metres(feat.elevation)} in ${feat.region}.` : "");
    const hasMap = DATA.some(d => isNum(d.lat) && isNum(d.lng));
    const rib = ribbon();
    const hint = DATA.slice(0, 2).map(d => d.name).join(", ");
    const chips = [["all", "All"], ...[...regions].map(r => [r, r])];
    if (DATA.some(d => isNum(d.elevation) && d.elevation >= 3000)) chips.push(["high", "Above 3,000 m"]);

    return `
    <section class="hero" aria-labelledby="h1">
      <div class="slides" aria-hidden="true">
        ${heroItems.map((d, k) => `<div class="slide${k === 0 ? " active" : ""}" style="--h:${hue(d.id)}">${d.cover ? `<img src="${esc(d.cover)}" alt="" decoding="async">` : ""}</div>`).join("")}
      </div>
      <div class="hero-main">
        <p class="eyebrow rise" style="--d:0">Travel photography by ${esc(ME.name)}</p>
        <h1 id="h1" class="rise" style="--d:1">${esc(headline)}</h1>
        <p class="lede rise" style="--d:2">Real photographs from every trip, sorted by destination and altitude. New places are added after each journey.</p>
        <form class="search rise" style="--d:3" id="search" role="search">
          <label class="sr" for="q">Search destinations</label>
          <input id="q" type="search" placeholder="Try ${esc(hint || "a destination")}" autocomplete="off">
          <button class="btn gold" type="submit">Search</button>
        </form>
      </div>
      <div class="hero-bar rise" style="--d:5">
        <span class="hero-cap" id="hero-cap"></span>
        ${heroItems.length > 1 ? `<div class="dots" role="group" aria-label="Choose a slide">${heroItems.map((d, k) => `<button class="dot" type="button" data-slide="${k}" aria-label="Show ${esc(d.name)}" aria-current="${k === 0}"></button>`).join("")}</div>` : ""}
      </div>
    </section>

    <div class="stats" role="list">
      <div class="stat" role="listitem"><b data-count="${n}">${n}</b><span>Destinations</span></div>
      <div class="stat" role="listitem"><b data-count="${totalPhotos}">${totalPhotos}</b><span>Photographs</span></div>
      <div class="stat" role="listitem"><b data-count="${regions.size}">${regions.size}</b><span>States and regions</span></div>
      <div class="stat" role="listitem"><b data-count="${elev.length ? Math.max(...elev) : 0}">${elev.length ? num(Math.max(...elev)) : 0}</b><span>Highest point, metres</span></div>
    </div>

    <section class="block featured" aria-labelledby="feat-h">
      <a class="reveal" href="#/${esc(feat.id)}" aria-label="Open ${esc(feat.name)}">${frame(feat, feat.cover, `${feat.name}, cover photograph`)}</a>
      <div class="reveal" style="--i:1">
        <p class="eyebrow">Featured destination</p>
        <h2 id="feat-h">${esc(feat.name)}</h2>
        ${featLine ? `<p>${esc(featLine)}</p>` : ""}
        <div class="tags">
          ${feat.region ? `<span class="tag">${esc(feat.region)}</span>` : ""}
          ${isNum(feat.elevation) ? `<span class="tag">${metres(feat.elevation)}</span>` : ""}
          <span class="tag">${plural(feat.photos.length, "photograph")}</span>
        </div>
        <a class="btn" href="#/${esc(feat.id)}">View photographs</a>
      </div>
    </section>

    <section class="block places" id="places" aria-labelledby="pl-h">
      <div class="places-head reveal">
        <div><p class="eyebrow">Explore</p><h2 id="pl-h">All destinations</h2></div>
        <span class="count" id="count" aria-live="polite"></span>
      </div>
      <div class="chips reveal" role="group" aria-label="Filter destinations">
        ${chips.map(([v, label]) => `<button class="chip" type="button" data-f="${esc(v)}" aria-pressed="${v === "all"}">${esc(label)}</button>`).join("")}
      </div>
      <div class="grid" id="grid"></div>
    </section>

    ${rib ? `<section class="block" id="altitude" aria-labelledby="alt-h">
      <div class="reveal">
        <p class="eyebrow">The climb</p>
        <h2 id="alt-h">Journey by altitude</h2>
        <p class="lede">Each point is a place, set at its height above sea level. Select one to open its photographs.</p>
      </div>
      <div class="ribbon-scroll">${rib}</div>
    </section>` : ""}

    ${hasMap ? `<section class="block map-sec" id="map" aria-labelledby="map-h">
      <div class="reveal"><p class="eyebrow">On the map</p><h2 id="map-h">Where they are</h2></div>
      <div id="map-canvas" role="region" aria-label="Map of visited places"></div>
    </section>` : ""}

    <section class="block cta" id="about" aria-labelledby="ab-h">
      <div class="reveal">
        <p class="eyebrow">About the photographer</p>
        <h2 id="ab-h">Hi, I'm ${esc(ME.name.split(" ")[0])}.</h2>
        <p>I'm a computer science student from Jaipur. I photograph the places I travel to and keep them here, sorted by destination. Say hello or follow along.</p>
      </div>
      <div class="cta-links reveal" style="--i:1">
        <a class="btn gold" href="mailto:${ME.email}">Email me</a>
        <a class="btn ghost" href="${ME.github}" rel="noopener">GitHub</a>
        <a class="btn ghost" href="${ME.linkedin}" rel="noopener">LinkedIn</a>
      </div>
    </section>`;
  }

  function afterHome() {
    goSlide(0);
    startSlides();
    updateGrid();
    initMap();
    const form = $("#search"), q = $("#q");
    q.addEventListener("input", () => { query = q.value; updateGrid(); });
    form.addEventListener("submit", e => { e.preventDefault(); $("#places").scrollIntoView({ behavior: reduced ? "auto" : "smooth" }); });
  }

  function initMap() {
    const el = $("#map-canvas");
    if (!el) return;
    if (!window.L) { el.innerHTML = '<p class="empty" style="padding:1rem">The map needs an internet connection to load.</p>'; return; }
    const pts = DATA.filter(d => isNum(d.lat) && isNum(d.lng));
    map = L.map(el, { scrollWheelZoom: false });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
    pts.forEach(d => {
      L.circleMarker([d.lat, d.lng], { radius: 8, color: "#12262B", weight: 2, fillColor: "#E59A2F", fillOpacity: 1 })
        .addTo(map)
        .bindPopup(`<a href="#/${esc(d.id)}"><strong>${esc(d.name)}</strong></a>`);
    });
    map.fitBounds(pts.map(d => [d.lat, d.lng]), { padding: [40, 40], maxZoom: 9 });
  }

  /* ---------- destination page ---------- */
  function placeView(i) {
    const d = DATA[i], n = DATA.length;
    gallery = d.photos.map((p, k) => ({ src: p.src, caption: p.caption, alt: p.caption || `${d.name}, photograph ${k + 1}` }));
    const facts = [
      isNum(d.elevation) && [metres(d.elevation), "Altitude"],
      d.region && [d.region, "Region"],
      d.date && [d.date, "Visited"],
      [String(d.photos.length), "Photographs"]
    ].filter(Boolean);
    const others = Array.from({ length: Math.min(3, n - 1) }, (_, k) => DATA[(i + 1 + k) % n]);

    return `
    <section class="p-hero" aria-labelledby="p-h">
      ${frame(d, d.cover, `${d.name}, cover photograph`, true)}
      <div class="p-hero-in">
        <a class="back rise" style="--d:0" href="#/places">All destinations</a>
        <h1 id="p-h" class="rise" style="--d:1">${esc(d.name)}</h1>
        <div class="tags rise" style="--d:2">
          ${d.region ? `<span class="tag">${esc(d.region)}</span>` : ""}
          ${isNum(d.elevation) ? `<span class="tag">${metres(d.elevation)}</span>` : ""}
        </div>
      </div>
    </section>
    <div class="factbar">${facts.map(([v, l]) => `<div class="fact"><b>${esc(v)}</b><span>${l}</span></div>`).join("")}</div>
    ${d.story ? `<section class="block story"><p class="eyebrow">The trip</p><p>${esc(d.story)}</p></section>` : ""}
    <section class="block" aria-labelledby="g-h">
      <div class="gallery-head"><h2 id="g-h">Photographs</h2><span class="count">${plural(gallery.length, "photo")}</span></div>
      ${gallery.length
        ? `<div class="gallery">${gallery.map((p, k) =>
            `<button class="g-item" type="button" data-i="${k}" style="--h:${hue(d.id)}" aria-label="Open photograph ${k + 1} of ${gallery.length}"><img src="${esc(p.src)}" alt="${esc(p.alt)}" loading="lazy" decoding="async"></button>`).join("")}</div>`
        : `<p class="empty">Photographs from this trip are coming soon.</p>`}
    </section>
    ${others.length ? `<section class="block more" aria-labelledby="m-h">
      <h2 id="m-h">More destinations</h2>
      <div class="grid">${others.map((o, k) => card(o, k)).join("")}</div>
    </section>` : ""}`;
  }

  /* ---------- lightbox ---------- */
  const lb = $("#lb"), lbImg = $("#lb-img"), lbCap = $("#lb-cap");
  let li = 0;
  function show(i) {
    if (!gallery.length) return;
    li = (i + gallery.length) % gallery.length;
    const p = gallery[li];
    lbImg.src = p.src;
    lbImg.alt = p.alt;
    lbCap.innerHTML = (p.caption ? `<span>${esc(p.caption)}</span>` : "") + `<span>${li + 1} of ${gallery.length}</span>`;
  }
  lb.addEventListener("click", e => {
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (act === "close" || e.target === lb || e.target.tagName === "FIGURE") lb.close();
    else if (act === "prev") show(li - 1);
    else if (act === "next") show(li + 1);
  });
  document.addEventListener("keydown", e => {
    if (!lb.open) return;
    if (e.key === "ArrowLeft") show(li - 1);
    if (e.key === "ArrowRight") show(li + 1);
  });
  let sx = null;
  lbImg.addEventListener("pointerdown", e => { sx = e.clientX; });
  lbImg.addEventListener("pointerup", e => {
    if (sx === null) return;
    const dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > 50) show(li + (dx < 0 ? 1 : -1));
  });
  lb.addEventListener("close", () => lbImg.removeAttribute("src"));

  /* ---------- clicks inside the page ---------- */
  app.addEventListener("click", e => {
    const photo = e.target.closest("[data-i]");
    if (photo) { show(+photo.dataset.i); lb.showModal(); return; }
    const dot = e.target.closest("[data-slide]");
    if (dot) { goSlide(+dot.dataset.slide); startSlides(); return; }
    const chip = e.target.closest("[data-f]");
    if (chip) {
      filter = chip.dataset.f;
      $$(".chip").forEach(c => c.setAttribute("aria-pressed", c === chip));
      updateGrid();
    }
  });

  /* ---------- header colour follows scroll ---------- */
  const onScroll = () => document.body.classList.toggle("scrolled", scrollY > 40);
  addEventListener("scroll", onScroll, { passive: true });

  /* ---------- routing: #/ (home), #/places, #/map, #/about, #/<destination-id> ---------- */
  function route() {
    const key = (location.hash.match(/^#\/([\w-]+)/) || [])[1] || "";
    const i = DATA.findIndex(d => d.id === key);
    document.body.classList.add("has-hero");

    if (i >= 0) {
      clearInterval(timer);
      if (map) { map.remove(); map = null; }
      app.innerHTML = placeView(i);
      view = "place";
      document.title = `${DATA[i].name}: ${SITE}`;
      window.scrollTo({ top: 0, behavior: "instant" });
      onScroll();
      observe();
      return;
    }
    const changed = view !== "home";
    if (changed) {
      filter = "all"; query = "";
      app.innerHTML = homeView();
      view = "home";
      document.title = `${SITE}: travel photography by ${ME.name}`;
      afterHome();
    }
    const target = key && document.getElementById(key);
    if (target) target.scrollIntoView({ behavior: changed || reduced ? "auto" : "smooth" });
    else window.scrollTo({ top: 0, behavior: "instant" });
    onScroll();
  }

  /* ---------- load data ---------- */
  document.getElementById("yr").textContent = new Date().getFullYear();
  fetch("destinations.json", { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(list => {
      DATA = list.map(d => {
        const photos = (d.photos || []).map(p => typeof p === "string" ? { src: p, caption: "" } : { src: p.src, caption: p.caption || "" });
        return { ...d, photos, cover: d.cover || photos[0]?.src || "" };
      });
      if (!DATA.length) { app.innerHTML = '<p class="wrap empty" style="padding-top:3rem">No destinations yet.</p>'; return; }
      route();
      addEventListener("hashchange", route);
    })
    .catch(() => {
      document.body.classList.remove("has-hero");
      app.innerHTML = `<div class="wrap" style="padding-top:3rem;max-width:60ch">
        <h2>Couldn't load destinations.json</h2>
        <p class="lede">Check that destinations.json is in the same folder as index.html and has no typos (a missing comma or an extra bracket is the usual cause). You can test it at jsonlint.com.</p>
        <p class="lede" style="margin-top:1rem">Opening this file by double-clicking also causes this. Run <code>python -m http.server 8000</code> in this folder and visit <code>http://localhost:8000</code>.</p></div>`;
    });
})();
</script>
</body>
</html>
