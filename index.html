<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frames at Altitude: travel photography by Rohit Sharma</title>
<meta name="description" content="Travel photography by Rohit Sharma from Kedarnath, Tungnath, Munsiyari, Rishikesh, Jaipur and more, sorted by destination and altitude.">
<meta name="theme-color" content="#12262B">
<meta property="og:type" content="website">
<meta property="og:title" content="Frames at Altitude: travel photography by Rohit Sharma">
<meta property="og:description" content="Destinations, altitudes and photographs from the road.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{
  --mist:#E8EDEB;
  --snow:#F6F8F7;
  --ink:#12262B;
  --deep:#0C1B1F;
  --slate:#586C70;
  --glacier:#2C7A87;
  --marigold:#E59A2F;
  --line:#C5D0CE;
  --display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --pad:clamp(1.25rem,4vw,3.5rem);
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--mist);color:var(--ink);font-family:var(--serif);font-size:1.125rem;line-height:1.65;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--marigold);outline-offset:3px}
section{scroll-margin-top:4.5rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.empty{color:var(--slate);font-style:italic}

/* ---------- header (transparent over photos, solid after scrolling) ---------- */
.site-header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem var(--pad);background:color-mix(in srgb,var(--mist) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);font-family:var(--display);transition:background .35s,color .35s,border-color .35s}
body{padding-top:3.6rem}
body.has-hero{padding-top:0}
.brand{font-weight:800;font-size:1.05rem;text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
@media (max-width:520px){.site-header nav{gap:1rem;font-size:.9rem}.brand{font-size:.95rem}}
.site-header nav{display:flex;gap:1.6rem;font-size:.95rem}
.site-header nav a{text-decoration:none;padding:.25rem 0;border-bottom:2px solid transparent;opacity:.85}
.site-header nav a:hover{opacity:1;border-color:var(--marigold)}
.has-hero:not(.scrolled) .site-header{background:transparent;backdrop-filter:none;border-color:transparent;color:#fff}

/* ---------- shared ---------- */
.wrap{padding:0 var(--pad)}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
h2{font-size:clamp(1.9rem,3.8vw,3rem)}
.eyebrow{font-family:var(--display);font-weight:600;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--glacier);margin-bottom:.7rem}
.lede{color:var(--slate);max-width:52ch}
.btn{display:inline-block;font-family:var(--display);font-weight:600;font-size:1rem;text-decoration:none;background:var(--ink);color:var(--snow);padding:.85rem 1.5rem;border-radius:999px;border:0;transition:background .2s,transform .2s}
.btn:hover{background:var(--glacier)}
.btn.gold{background:var(--marigold);color:var(--deep)}
.btn.gold:hover{background:#F2AE4C}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.frame{position:relative;overflow:hidden;background:linear-gradient(160deg,hsl(var(--h) 32% 64%),hsl(calc(var(--h) + 35) 30% 32%))}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s ease,transform .8s ease}
img.in{opacity:1}
.reveal{opacity:0;translate:0 26px;transition:opacity .8s cubic-bezier(.2,.7,.2,1),translate .8s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0) * 70ms)}
.reveal.in-view{opacity:1;translate:none}
.block{padding:clamp(3rem,7vw,6rem) var(--pad)}

/* ---------- hero with photo slideshow ---------- */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;color:#fff;background:var(--deep);isolation:isolate}
.slides,.slide{position:absolute;inset:0}
.slide{opacity:0;transition:opacity 1.4s ease;background:linear-gradient(160deg,hsl(var(--h) 32% 40%),hsl(calc(var(--h) + 35) 30% 16%));overflow:hidden}
.slide.active{opacity:1}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}
.slide img.in{opacity:1}
.slide.active img{animation:kenburns 10s ease-out forwards}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.09)}}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:
  linear-gradient(to top,rgba(8,18,20,.86) 0%,rgba(8,18,20,.45) 40%,rgba(8,18,20,.30) 70%,rgba(8,18,20,.55) 100%)}
.hero-main{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:7rem var(--pad) 2rem;max-width:64rem}
.hero .eyebrow{color:var(--marigold)}
.hero h1{font-size:clamp(2.7rem,7vw,6rem);font-variation-settings:"opsz" 96;text-shadow:0 2px 24px rgba(0,0,0,.35);margin-bottom:1.1rem}
.hero .lede{color:#DCE6E4;font-size:1.2rem;margin-bottom:1.75rem}
.search{display:flex;gap:.5rem;max-width:34rem;padding:.4rem;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(10px)}
.search input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:inherit;font-family:var(--display);font-size:1rem;padding:.6rem 1.1rem}
.search input::placeholder{color:rgba(255,255,255,.75)}
.search input:focus{outline:none}
.search:focus-within{border-color:#fff;box-shadow:0 0 0 3px rgba(229,154,47,.6)}
.hero-bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem var(--pad) 1.75rem;font-family:var(--display);font-size:.95rem;border-top:1px solid rgba(255,255,255,.22);margin:0 var(--pad);padding-left:0;padding-right:0}
.hero-cap a{text-decoration:none;border-bottom:2px solid var(--marigold)}
.dots{display:flex;gap:.55rem}
.dot{width:.7rem;height:.7rem;padding:0;border-radius:50%;border:1.5px solid #fff;background:transparent;transition:background .3s,transform .3s}
.dot[aria-current="true"]{background:#fff;transform:scale(1.25)}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 140ms + 200ms)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--ink);color:var(--snow)}
.stat{padding:clamp(1.5rem,3vw,2.5rem) var(--pad);border-right:1px solid rgba(255,255,255,.12)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(2rem,4.5vw,3.4rem);line-height:1;letter-spacing:-.02em;color:var(--marigold)}
.stat span{font-family:var(--display);font-size:.92rem;color:#B9C8C6}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid rgba(255,255,255,.12)}}

/* ---------- featured ---------- */
.featured{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(1.5rem,4vw,4rem);align-items:center}
.featured .frame{aspect-ratio:4/3;border-radius:var(--radius)}
.featured h2{margin-bottom:1rem}
.featured p{color:var(--slate);margin-bottom:1.5rem;max-width:46ch}
.tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.75rem}
.tag{font-family:var(--display);font-size:.88rem;font-weight:600;padding:.35rem .85rem;border-radius:999px;background:var(--snow);border:1px solid var(--line)}
@media (max-width:820px){.featured{grid-template-columns:1fr}}

/* ---------- destinations grid ---------- */
.places{background:var(--snow);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.places-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:1rem 2rem;margin-bottom:1.5rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:2rem}
.chip{font-family:var(--display);font-weight:600;font-size:.92rem;padding:.5rem 1.1rem;border-radius:999px;background:transparent;border:1.5px solid var(--line);transition:background .2s,color .2s,border-color .2s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--snow);border-color:var(--ink)}
.count{font-family:var(--display);font-size:.95rem;color:var(--slate)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,17.5rem),1fr));gap:1.5rem}
.card{position:relative;display:block;aspect-ratio:3/4;border-radius:var(--radius);overflow:hidden;text-decoration:none;color:#fff;box-shadow:0 1px 2px rgba(18,38,43,.08);transition:opacity .8s cubic-bezier(.2,.7,.2,1) calc(var(--i,0) * 70ms),translate .8s cubic-bezier(.2,.7,.2,1) calc(var(--i,0) * 70ms),box-shadow .3s,transform .3s}
.card:hover,.card:focus-visible{box-shadow:0 18px 40px -12px rgba(18,38,43,.45);transform:translateY(-4px)}
.card .frame{position:absolute;inset:0}
.card:hover .frame img,.card:focus-visible .frame img{transform:scale(1.07)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,18,20,.85) 0%,rgba(8,18,20,.15) 55%,rgba(8,18,20,.25) 100%)}
.badge{position:absolute;top:1rem;z-index:2;font-family:var(--display);font-size:.8rem;font-weight:600;padding:.3rem .75rem;border-radius:999px;background:rgba(255,255,255,.9);color:var(--ink)}
.badge.l{left:1rem}
.badge.r{right:1rem;background:var(--marigold)}
.card-body{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:1.25rem}
.card h3{font-size:clamp(1.35rem,2vw,1.7rem);margin-bottom:.15rem;overflow-wrap:anywhere}
.card-meta{display:flex;justify-content:space-between;font-family:var(--display);font-size:.9rem;color:#DCE6E4}
.card .go{opacity:0;transform:translateX(-6px);transition:opacity .3s,transform .3s}
.card:hover .go,.card:focus-visible .go{opacity:1;transform:none}
.no-match{padding:2rem 0}

/* ---------- altitude ribbon ---------- */
.ribbon-scroll{overflow-x:auto;margin-top:1.5rem;padding-bottom:.5rem}
.ribbon{min-width:720px;width:100%;height:auto;display:block}
.ribbon .base{stroke:var(--line);stroke-width:1.5}
.ribbon .area{fill:var(--glacier);opacity:.10}
.ribbon .line{fill:none;stroke:var(--glacier);stroke-width:3;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.ribbon.go .line{animation:draw 2.2s cubic-bezier(.5,0,.2,1) forwards}
.ribbon.go .area{animation:fadein 1.2s 1.4s ease both}
.ribbon .pt circle{fill:var(--marigold);stroke:var(--ink);stroke-width:2;transition:r .2s}
.ribbon a:hover circle,.ribbon a:focus-visible circle{r:11}
.ribbon .pt text{font-family:var(--display);fill:var(--ink)}
.ribbon .pt .nm{font-size:18px;font-weight:600}
.ribbon .pt .el{font-size:15px;fill:var(--slate)}
.ribbon .axis{font-family:var(--display);font-size:13px;fill:var(--slate)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}}

/* ---------- map ---------- */
.map-sec{background:var(--snow);border-top:1px solid var(--line)}
#map-canvas{height:min(32rem,70vh);margin-top:1.5rem;border-radius:var(--radius);border:1px solid var(--line);background:var(--mist);z-index:0}
.leaflet-popup-content a{font-family:var(--display);color:var(--glacier)}

/* ---------- about / contact ---------- */
.cta{background:var(--ink);color:var(--snow);display:grid;grid-template-columns:1.2fr 1fr;gap:2.5rem;align-items:center}
.cta .eyebrow{color:var(--marigold)}
.cta
