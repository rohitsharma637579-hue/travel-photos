<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frames at Altitude: photographs by Rohit Sharma</title>
<meta name="description" content="Travel photographs by Rohit Sharma, sorted by destination and altitude.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{
  --mist:#E8EDEB;      /* page background */
  --snow:#F6F8F7;      /* raised surfaces */
  --ink:#12262B;       /* text */
  --slate:#586C70;     /* secondary text */
  --glacier:#2C7A87;   /* lines, links */
  --marigold:#E59A2F;  /* the one warm accent: points, focus */
  --line:#C5D0CE;
  --display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --pad:clamp(1.25rem,4vw,3.5rem);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--mist);color:var(--ink);font-family:var(--serif);font-size:1.125rem;line-height:1.65;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--marigold);outline-offset:3px}
section{scroll-margin-top:4.5rem}

/* ---------- header ---------- */
.site-header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.85rem var(--pad);background:color-mix(in srgb,var(--mist) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);font-family:var(--display)}
.brand{font-weight:800;font-size:1.05rem;text-decoration:none;letter-spacing:-.01em}
.site-header nav{display:flex;gap:1.5rem;font-size:.95rem}
.site-header nav a{text-decoration:none;color:var(--slate);padding:.25rem 0;border-bottom:2px solid transparent}
.site-header nav a:hover{color:var(--ink);border-color:var(--marigold)}

/* ---------- shared ---------- */
.wrap{padding:0 var(--pad)}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1.05}
h2{font-size:clamp(1.75rem,3.4vw,2.6rem);margin-bottom:.6rem}
.lede{color:var(--slate);max-width:52ch}
.btn{display:inline-block;font-family:var(--display);font-weight:600;font-size:1rem;text-decoration:none;background:var(--ink);color:var(--snow);padding:.8rem 1.4rem;border-radius:999px;transition:background .2s}
.btn:hover{background:var(--glacier)}
.frame{position:relative;overflow:hidden;background:linear-gradient(160deg,hsl(var(--h) 32% 64%),hsl(calc(var(--h) + 35) 30% 32%))}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease,transform .7s ease}
img.in{opacity:1}
.empty{color:var(--slate);font-style:italic}

/* ---------- hero: the one orchestrated moment ---------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(1.5rem,4vw,4rem);align-items:end;padding:clamp(2rem,6vw,5rem) var(--pad) clamp(2.5rem,6vw,4.5rem)}
.hero h1{font-size:clamp(2.6rem,6.6vw,5.6rem);font-variation-settings:"opsz" 96;margin-bottom:1.25rem}
.hero .lede{margin-bottom:2rem;font-size:1.2rem}
.hero figure a{display:block;text-decoration:none}
.hero figcaption{font-family:var(--display);font-size:.95rem;color:var(--slate);margin-top:.6rem;display:flex;justify-content:space-between;gap:1rem}
.hero .frame{aspect-ratio:4/5}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 130ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* ---------- elevation ribbon ---------- */
.ribbon-sec{padding:clamp(2rem,5vw,4rem) var(--pad);border-top:1px solid var(--line)}
.ribbon-scroll{overflow-x:auto;margin-top:1.5rem;padding-bottom:.5rem}
.ribbon{min-width:720px;width:100%;height:auto;display:block}
.ribbon .base{stroke:var(--line);stroke-width:1.5}
.ribbon .area{fill:var(--glacier);opacity:.10;animation:fadein 1.2s 1.6s ease both}
.ribbon .line{fill:none;stroke:var(--glacier);stroke-width:3;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2s .5s cubic-bezier(.5,0,.2,1) forwards}
.ribbon .pt circle{fill:var(--marigold);stroke:var(--ink);stroke-width:2;transition:r .2s}
.ribbon a:hover circle,.ribbon a:focus-visible circle{r:11}
.ribbon .pt text{font-family:var(--display);fill:var(--ink)}
.ribbon .pt .nm{font-size:18px;font-weight:600}
.ribbon .pt .el{font-size:15px;fill:var(--slate)}
.ribbon .axis{font-family:var(--display);font-size:13px;fill:var(--slate)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}}

/* ---------- destinations: uneven editorial grid ---------- */
.places{padding:clamp(2rem,5vw,4rem) var(--pad);border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(1.5rem,3vw,2.75rem) 1.5rem;margin-top:2rem}
.card{grid-column:span 12;text-decoration:none;display:block}
.card .frame{aspect-ratio:4/3}
.card:hover .frame img,.card:focus-visible .frame img{transform:scale(1.04)}
.card h3{font-size:1.6rem;margin-top:.85rem}
.card:hover h3{text-decoration:underline;text-decoration-color:var(--marigold);text-decoration-thickness:3px;text-underline-offset:4px}
.card .meta{display:flex;gap:1.25rem;flex-wrap:wrap;font-family:var(--display);font-size:.95rem;color:var(--slate);margin-top:.2rem}
@media (min-width:820px){
  .card:nth-child(4n+1){grid-column:span 7}
  .card:nth-child(4n+2){grid-column:span 5;align-self:end}
  .card:nth-child(4n+3){grid-column:span 5}
  .card:nth-child(4n+4){grid-column:span 7;align-self:end}
  .card:nth-child(4n+2) .frame,.card:nth-child(4n+3) .frame{aspect-ratio:4/5}
}

/* ---------- map ---------- */
.map-sec{padding:clamp(2rem,5vw,4rem) var(--pad);border-top:1px solid var(--line)}
#map-canvas{height:min(30rem,70vh);margin-top:1.5rem;border-radius:6px;border:1px solid var(--line);background:var(--snow);z-index:0}
.leaflet-popup-content a{font-family:var(--display);color:var(--glacier)}

/* ---------- about ---------- */
.about{padding:clamp(2rem,5vw,4rem) var(--pad) clamp(3rem,6vw,5rem);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:2rem}
.about p{max-width:46ch}
.links{list-style:none;display:flex;flex-direction:column;gap:.4rem;font-family:var(--display)}
.links a{color:var(--glacier);text-underline-offset:4px}
@media (max-width:820px){.about{grid-template-columns:1fr}}

/* ---------- destination page ---------- */
.back{display:inline-block;font-family:var(--display);font-size:.95rem;margin:1.5rem var(--pad) 0;color:var(--slate)}
.place-head{padding:1rem var(--pad) 2rem;display:grid;grid-template-columns:1.3fr 1fr;gap:2rem;align-items:end}
.place-head h1{font-size:clamp(3rem,9vw,7.5rem);font-variation-settings:"opsz" 96}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1.25rem;font-family:var(--display);font-size:1rem}
dl.facts dt{color:var(--slate)}
dl.facts dd{font-weight:600}
.cover{margin:0 var(--pad)}
.cover .frame{aspect-ratio:21/9;border-radius:4px}
.story{padding:2.5rem var(--pad) 1rem;max-width:calc(62ch + var(--pad) * 2);font-size:1.25rem}
.gallery{padding:2rem var(--pad) 3rem;column-count:3;column-gap:1rem}
.g-item{display:block;width:100%;margin:0 0 1rem;padding:0;border:0;break-inside:avoid;cursor:zoom-in;overflow:hidden;background:linear-gradient(160deg,hsl(var(--h) 32% 64%),hsl(calc(var(--h) + 35) 30% 32%));min-height:9rem}
.g-item img{width:100%;height:auto;opacity:0;transition:opacity .6s ease,transform .6s ease}
.g-item img.in{opacity:1}
.g-item:hover img{transform:scale(1.03)}
.gallery-empty{padding:2rem var(--pad) 4rem}
@media (max-width:900px){.gallery{column-count:2}.place-head{grid-template-columns:1fr}}
@media (max-width:520px){.gallery{column-count:1}}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:1rem;border-top:1px solid var(--line);margin:0 var(--pad);padding:1.5rem 0 3rem;font-family:var(--display)}
.pager a{text-decoration:none}
.pager small{display:block;color:var(--slate);font-size:.9rem}
.pager strong{font-size:1.5rem;font-weight:800}
.pager .next{text-align:right}
.pager a:hover strong{text-decoration:underline;text-decoration-color:var(--marigold);text-decoration-thickness:3px;text-underline-offset:4px}

/* ---------- lightbox ---------- */
dialog#lb{border:0;padding:0;background:transparent;width:100vw;height:100vh;max-width:none;max-height:none;color:#fff}
dialog#lb[open]{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.5rem;padding:1rem}
dialog#lb::backdrop{background:rgba(9,18,20,.94)}
#lb figure{display:flex;flex-direction:column;align-items:center;gap:.75rem;min-width:0}
#lb-img{max-width:100%;max-height:80vh;object-fit:contain;touch-action:pan-y;user-select:none}
#lb-cap{font-family:var(--display);font-size:.95rem;text-align:center;color:#C9D6D4;display:flex;flex-direction:column;gap:.1rem}
.lb-btn{font-family:var(--display);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;transition:background .2s}
.lb-btn:hover{background:rgba(255,255,255,.2)}
.lb-nav{width:3rem;height:3rem;font-size:1.6rem;line-height:1}
.lb-close{position:absolute;top:1rem;right:1rem;padding:.5rem 1.1rem;font-size:.95rem}
@media (max-width:640px){
  dialog#lb[open]{grid-template-columns:1fr;grid-template-rows:1fr auto;align-content:center}
  .lb-nav{display:none}
}

/* ---------- footer ---------- */
footer{padding:1.5rem var(--pad);border-top:1px solid var(--line);font-family:var(--display);font-size:.9rem;color:var(--slate);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem}

@media (max-width:820px){.hero{grid-template-columns:1fr}.hero .frame{aspect-ratio:4/3}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .ribbon .line{stroke-dashoffset:0}
}
</style>
</head>
<body>

<header class="site-header">
  <a class="brand" href="#/">Frames at Altitude</a>
  <nav aria-label="Main">
    <a href="#/places">Places</a>
    <a href="#/map">Map</a>
    <a href="#/about">About</a>
  </nav>
</header>

<main id="app" tabindex="-1"><p class="wrap empty" style="padding-top:3rem">Loading photographs…</p></main>
<noscript><p class="wrap">This site needs JavaScript to show the photographs.</p></noscript>

<footer>
  <span>© <span id="yr"></span> Rohit Sharma</span>
  <span>Map data © OpenStreetMap contributors</span>
</footer>

<dialog id="lb" aria-label="Photograph viewer">
  <button class="lb-btn lb-close" type="button" data-act="close">Close</button>
  <button class="lb-btn lb-nav" type="button" data-act="prev" aria-label="Previous photograph">&#8249;</button>
  <figure>
    <img id="lb-img" alt="">
    <figcaption id="lb-cap"></figcaption>
  </figure>
  <button class="lb-btn lb-nav" type="button" data-act="next" aria-label="Next photograph">&#8250;</button>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(() => {
  const SITE = "Frames at Altitude";
  const ME = {
    name: "Rohit Sharma",
    github: "https://github.com/rohitsharma637579-hue",
    linkedin: "https://www.linkedin.com/in/rohit-sharma02-cse",
    email: "rohitsharma637579@gmail.com"
  };
  const WORDS = ["No","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten"];
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const app = document.getElementById("app");
  const $ = (s, r = document) => r.querySelector(s);
  let DATA = [], map = null, view = null, gallery = [];

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const hue = id => [...id].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
  const metres = n => n.toLocaleString("en-IN") + " m";
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const isNum = Number.isFinite;

  /* ---------- image fade-in / hide broken images (events don't bubble, so capture) ---------- */
  document.addEventListener("load", e => { if (e.target.tagName === "IMG") e.target.classList.add("in"); }, true);
  document.addEventListener("error", e => {
    if (e.target.tagName !== "IMG" || e.target.id === "lb-img") return;
    const item = e.target.closest(".g-item");
    (item || e.target).remove();
  }, true);

  const frame = (d, src, alt = "", eager = false) =>
    `<div class="frame" style="--h:${hue(d.id)}">${src ? `<img src="${esc(src)}" alt="${esc(alt)}" ${eager ? "" : 'loading="lazy"'} decoding="async">` : ""}</div>`;

  /* ---------- elevation ribbon (SVG) ---------- */
  function ribbon() {
    const pts = DATA.filter(d => isNum(d.elevation)).sort((a, b) => a.elevation - b.elevation);
    if (pts.length < 2) return "";
    const W = 1000, H = 340, padX = 80, top = 56, bottom = 74;
    const max = Math.max(...pts.map(p => p.elevation)) * 1.08;
    const x = i => padX + i * (W - 2 * padX) / (pts.length - 1);
    const y = e => top + (1 - e / max) * (H - top - bottom);
    const base = H - bottom;
    const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p.elevation).toFixed(1)}`).join(" ");
    const area = `${line} L${x(pts.length - 1)} ${base} L${x(0)} ${base} Z`;
    const marks = pts.map((p, i) => `
      <a class="pt" href="#/${esc(p.id)}" aria-label="${esc(p.name)}, ${p.elevation} metres">
        <circle cx="${x(i).toFixed(1)}" cy="${y(p.elevation).toFixed(1)}" r="8"/>
        <text class="nm" x="${x(i).toFixed(1)}" y="${(y(p.elevation) - 18).toFixed(1)}" text-anchor="middle">${esc(p.name)}</text>
        <text class="el" x="${x(i).toFixed(1)}" y="${base + 30}" text-anchor="middle">${metres(p.elevation)}</text>
      </a>`).join("");
    return `<svg class="ribbon" viewBox="0 0 ${W} ${H}" role="group" aria-label="Places arranged by altitude">
      <path class="area" d="${area}"/>
      <line class="base" x1="${padX - 30}" y1="${base}" x2="${W - padX + 30}" y2="${base}"/>
      <text class="axis" x="${padX - 30}" y="${base + 54}">Sea level</text>
      <path class="line" pathLength="1" d="${line}"/>
      ${marks}
    </svg>`;
  }

  /* ---------- home ---------- */
  function homeView() {
    const n = DATA.length;
    const elev = DATA.map(d => d.elevation).filter(isNum);
    const headline = n > 1 && elev.length > 1
      ? `${WORDS[n] || n} places, from ${metres(Math.min(...elev))} to ${metres(Math.max(...elev))}.`
      : "Photographs from the road.";
    const lead = DATA.find(d => d.cover) || DATA[0];
    const hasMap = DATA.some(d => isNum(d.lat) && isNum(d.lng));
    const rib = ribbon();

    return `
    <section class="hero" aria-labelledby="h1">
      <div>
        <h1 id="h1" class="rise" style="--d:0">${esc(headline)}</h1>
        <p class="lede rise" style="--d:1">Photographs by ${esc(ME.name)}, sorted by destination and altitude. New places are added after each trip.</p>
        <a class="btn rise" style="--d:2" href="#/places">Browse the places</a>
      </div>
      ${lead ? `<figure class="rise" style="--d:3">
        <a href="#/${esc(lead.id)}">${frame(lead, lead.cover, `${lead.name}, cover photograph`, true)}</a>
        <figcaption><span>${esc(lead.name)}</span><span>${isNum(lead.elevation) ? metres(lead.elevation) : esc(lead.region)}</span></figcaption>
      </figure>` : ""}
    </section>

    ${rib ? `<section class="ribbon-sec" aria-labelledby="alt-h">
      <h2 id="alt-h">Places by altitude</h2>
      <p class="lede">Each point is a place, set at its height above sea level. Select one to open its photographs.</p>
      <div class="ribbon-scroll">${rib}</div>
    </section>` : ""}

    <section class="places" id="places" aria-labelledby="pl-h">
      <h2 id="pl-h">All places</h2>
      <div class="grid">
        ${DATA.map(d => `
        <a class="card" href="#/${esc(d.id)}">
          ${frame(d, d.cover, `${d.name}, cover photograph`)}
          <h3>${esc(d.name)}</h3>
          <div class="meta">
            ${d.region ? `<span>${esc(d.region)}</span>` : ""}
            ${isNum(d.elevation) ? `<span>${metres(d.elevation)}</span>` : ""}
            <span>${plural(d.photos.length, "photograph")}</span>
          </div>
        </a>`).join("")}
      </div>
    </section>

    ${hasMap ? `<section class="map-sec" id="map" aria-labelledby="map-h">
      <h2 id="map-h">Where they are</h2>
      <div id="map-canvas" role="region" aria-label="Map of visited places"></div>
    </section>` : ""}

    <section class="about" id="about" aria-labelledby="ab-h">
      <div>
        <h2 id="ab-h">About</h2>
        <p>I'm ${esc(ME.name)}, a computer science student from Jaipur. I photograph the places I travel to and keep them here, sorted by destination.</p>
      </div>
      <ul class="links">
        <li><a href="${ME.github}" rel="noopener">GitHub</a></li>
        <li><a href="${ME.linkedin}" rel="noopener">LinkedIn</a></li>
        <li><a href="mailto:${ME.email}">${ME.email}</a></li>
      </ul>
    </section>`;
  }

  function initMap() {
    const el = $("#map-canvas");
    if (!el) return;
    if (!window.L) { el.innerHTML = '<p class="empty" style="padding:1rem">The map needs an internet connection to load.</p>'; return; }
    const pts = DATA.filter(d => isNum(d.lat) && isNum(d.lng));
    map = L.map(el, { scrollWheelZoom: false });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
    pts.forEach(d => {
      L.circleMarker([d.lat, d.lng], { radius: 8, color: "#12262B", weight: 2, fillColor: "#E59A2F", fillOpacity: 1 })
        .addTo(map)
        .bindPopup(`<a href="#/${esc(d.id)}"><strong>${esc(d.name)}</strong></a>`);
    });
    map.fitBounds(pts.map(d => [d.lat, d.lng]), { padding: [40, 40], maxZoom: 9 });
  }

  /* ---------- destination page ---------- */
  function placeView(i) {
    const d = DATA[i], n = DATA.length;
    const prev = DATA[(i - 1 + n) % n], next = DATA[(i + 1) % n];
    gallery = d.photos.map((p, k) => ({ src: p.src, caption: p.caption, alt: p.caption || `${d.name}, photograph ${k + 1}` }));
    const facts = [
      d.region && ["Region", d.region],
      isNum(d.elevation) && ["Altitude", metres(d.elevation)],
      d.date && ["Visited", d.date],
      ["Photographs", String(d.photos.length)]
    ].filter(Boolean);

    return `
    <a class="back" href="#/places">All places</a>
    <header class="place-head">
      <h1>${esc(d.name)}</h1>
      <dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    </header>
    <div class="cover">${frame(d, d.cover, `${d.name}, cover photograph`, true)}</div>
    ${d.story ? `<p class="story">${esc(d.story)}</p>` : ""}
    ${gallery.length
      ? `<div class="gallery" style="--h:${hue(d.id)}">${gallery.map((p, k) =>
          `<button class="g-item" type="button" data-i="${k}" style="--h:${hue(d.id)}" aria-label="Open photograph ${k + 1} of ${gallery.length}"><img src="${esc(p.src)}" alt="${esc(p.alt)}" loading="lazy" decoding="async"></button>`).join("")}</div>`
      : `<p class="gallery-empty empty">Photographs from this trip are coming soon.</p>`}
    <nav class="pager" aria-label="Other places">
      <a class="prev" href="#/${esc(prev.id)}"><small>Previous</small><strong>${esc(prev.name)}</strong></a>
      <a class="next" href="#/${esc(next.id)}"><small>Next</small><strong>${esc(next.name)}</strong></a>
    </nav>`;
  }

  /* ---------- lightbox ---------- */
  const lb = $("#lb"), lbImg = $("#lb-img"), lbCap = $("#lb-cap");
  let li = 0;
  function show(i) {
    if (!gallery.length) return;
    li = (i + gallery.length) % gallery.length;
    const p = gallery[li];
    lbImg.src = p.src;
    lbImg.alt = p.alt;
    lbCap.innerHTML = (p.caption ? `<span>${esc(p.caption)}</span>` : "") + `<span>${li + 1} of ${gallery.length}</span>`;
  }
  app.addEventListener("click", e => {
    const b = e.target.closest("[data-i]");
    if (b) { show(+b.dataset.i); lb.showModal(); }
  });
  lb.addEventListener("click", e => {
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (act === "close" || e.target === lb || e.target.tagName === "FIGURE") lb.close();
    else if (act === "prev") show(li - 1);
    else if (act === "next") show(li + 1);
  });
  document.addEventListener("keydown", e => {
    if (!lb.open) return;
    if (e.key === "ArrowLeft") show(li - 1);
    if (e.key === "ArrowRight") show(li + 1);
  });
  let sx = null;
  lbImg.addEventListener("pointerdown", e => { sx = e.clientX; });
  lbImg.addEventListener("pointerup", e => {
    if (sx === null) return;
    const dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > 50) show(li + (dx < 0 ? 1 : -1));
  });
  lb.addEventListener("close", () => { lbImg.removeAttribute("src"); });

  /* ---------- routing: #/ (home), #/places, #/map, #/about, #/<destination-id> ---------- */
  function route() {
    const key = (location.hash.match(/^#\/([\w-]+)/) || [])[1] || "";
    const i = DATA.findIndex(d => d.id === key);

    if (i >= 0) {
      if (map) { map.remove(); map = null; }
      app.innerHTML = placeView(i);
      view = "place";
      document.title = `${DATA[i].name}: ${SITE}`;
      window.scrollTo({ top: 0, behavior: "instant" });
      return;
    }
    const changed = view !== "home";
    if (changed) {
      app.innerHTML = homeView();
      view = "home";
      document.title = `${SITE}: photographs by ${ME.name}`;
      initMap();
    }
    const target = key && document.getElementById(key);
    if (target) target.scrollIntoView({ behavior: changed || reduced ? "auto" : "smooth" });
    else window.scrollTo({ top: 0, behavior: "instant" });
  }

  /* ---------- load data ---------- */
  document.getElementById("yr").textContent = new Date().getFullYear();
  fetch("destinations.json", { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(list => {
      DATA = list.map(d => {
        const photos = (d.photos || []).map(p => typeof p === "string" ? { src: p, caption: "" } : { src: p.src, caption: p.caption || "" });
        return { ...d, photos, cover: d.cover || photos[0]?.src || "" };
      });
      if (!DATA.length) { app.innerHTML = '<p class="wrap empty" style="padding-top:3rem">No destinations yet.</p>'; return; }
      route();
      window.addEventListener("hashchange", route);
    })
    .catch(() => {
      app.innerHTML = `<div class="wrap" style="padding-top:3rem;max-width:60ch">
        <h2>Couldn't load destinations.json</h2>
        <p class="lede">Browsers block this file when the page is opened by double-clicking it. Run a local server in this folder instead:</p>
        <p><code>python -m http.server 8000</code>, then open <code>http://localhost:8000</code>.</p></div>`;
    });
})();
</script>
</body>
</html>
